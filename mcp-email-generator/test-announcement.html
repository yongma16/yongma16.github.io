<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于系统维护通知的邮件</title>
</head>
<body style="margin: 0; padding: 0; background-color: #fef3c7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
    <!-- Alert Header -->
    <tr>
      <td style="background-color: #f59e0b; padding: 24px 40px;">
        <table role="presentation" cellspacing="0" cellpadding="0" width="100%">
          <tr>
            <td>
              <span style="font-size: 32px;">📢</span>
            </td>
            <td style="padding-left: 16px;">
              <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #ffffff;">
                关于系统维护通知的邮件
              </h1>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <!-- Content -->
    <tr>
      <td style="padding: 40px;">
        <p style="margin: 0 0 20px; font-size: 17px; color: #374151; line-height: 1.7;">
          尊敬的全体员工：
        </p>
        <p style="margin: 0 0 24px; font-size: 17px; color: #374151; line-height: 1.7; font-weight: 500;">现就系统维护通知事宜与您联系，具体内容如下：</p>
        
        <ul style="margin: 0 0 24px; padding-left: 24px; line-height: 1.8;">
          <li style="margin-bottom: 12px; color: #1f2937; font-size: 16px;">维护时间：3月25日 00:00-06:00</li>
      <li style="margin-bottom: 12px; color: #1f2937; font-size: 16px;">影响范围：所有线上服务</li>
      <li style="margin-bottom: 12px; color: #1f2937; font-size: 16px;">请提前保存工作内容</li>
        </ul>
      </td>
    </tr>
    <!-- Footer -->
    <tr>
      <td style="padding: 24px 40px; background-color: #fffbeb; border-top: 2px solid #f59e0b;">
        <p style="margin: 0 0 4px; font-size: 15px; color: #92400e;">此致敬礼</p>
        <p style="margin: 0; font-size: 16px; font-weight: 600; color: #78350f;">IT部门</p>
      </td>
    </tr>
  </table>
</body>
</html>
